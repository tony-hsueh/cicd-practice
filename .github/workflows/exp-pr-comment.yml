name: Experiment - PR Comment

on:
  pull_request:

permissions:
  pull-requests: write   # 明確宣告寫入權限
  # ⚠️ 但如果這次觸發是來自 fork 的 pull_request,
  # GitHub 會強制把 GITHUB_TOKEN 降級成 read-only,
  # 這裡宣告的 permissions 會被忽略,留言步驟預期會失敗 (403)

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Show event context
        run: |
          echo "================================================"
          echo "📍 Event Context"
          echo "================================================"
          echo "event_name: ${{ github.event_name }}"
          echo "head_ref:   ${{ github.head_ref }}"   # PR 來源分支
          echo "base_ref:   ${{ github.base_ref }}"   # PR 目標分支 (main)
          echo "pr_number:  ${{ github.event.pull_request.number }}"

      - name: Try to comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '🤖 自動留言測試',
              `event: ${context.eventName}`,
              `repo: ${context.repo.owner}/${context.repo.repo}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            console.log('✅ 留言成功 -> GITHUB_TOKEN 有寫入權限');
