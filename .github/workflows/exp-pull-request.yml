name: Experiment - pull_request

on:
  pull_request:

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Show event context
        run: |
          echo "================================================"
          echo "📍 Event Context"
          echo "================================================"
          echo "event_name: ${{ github.event_name }}"
          echo "ref:        ${{ github.ref }}"
          echo "sha:        ${{ github.sha }}"
          echo "head_ref:   ${{ github.head_ref }}"   # PR 來源分支
          echo "base_ref:   ${{ github.base_ref }}"   # PR 目標分支 (main)

      - name: Try to read secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "================================================"
          echo "📍 Secret Access"
          echo "================================================"
          if [ -z "$MY_SECRET" ]; then
            echo "❌ MY_SECRET is EMPTY -> 這次執行讀不到 secret"
          else
            echo "✅ MY_SECRET 有值 (長度 ${#MY_SECRET}) -> 這次執行讀得到 secret"
          fi

      - name: Try to read variable
        env:
          MY_VAR: ${{ vars.MY_VAR }}
        run: |
          echo "================================================"
          echo "📍 Variable Access"
          echo "================================================"
          if [ -z "$MY_VAR" ]; then
            echo "❌ MY_VAR is EMPTY -> 這次執行讀不到 variable"
          else
            echo "✅ MY_VAR = $MY_VAR -> 這次執行讀得到 variable"
          fi

      - name: Checkout PR head code
        uses: actions/checkout@v4
        # pull_request 事件預設就是 checkout PR head 與 base 的 merge commit

      - name: Show checked-out file content (PR head version)
        run: |
          echo "================================================"
          echo "📍 Checked-out Content Proof (default checkout = PR head)"
          echo "================================================"
          cat branch-identifier.txt || echo "(找不到 branch-identifier.txt)"

      - name: Checkout base branch code instead
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
        # 對照組: 即使明確指定去 checkout base 分支的程式碼,
        # secrets 該讀不到還是讀不到,證明關鍵在 secret 是否暴露,
        # 而不是 checkout 了誰的程式碼

      - name: Show checked-out file content (base branch version)
        run: |
          echo "================================================"
          echo "📍 Checked-out Content Proof (explicit base branch checkout)"
          echo "================================================"
          cat branch-identifier.txt || echo "(找不到 branch-identifier.txt)"
